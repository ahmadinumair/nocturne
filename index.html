        const pingBackend = async () => {
          try {
            const res = await fetch('http://localhost:8080/api/health', { method: 'GET' });

              setBackendOnline(true);
              const watchRes = await fetch('http://localhost:8080/api/watches');
              if (watchRes.ok) {
                const data = await watchRes.json();
                if (data.data) setWatches(data.data);
              }
            } else {
              setBackendOnline(false);
            }
          } catch {
            setBackendOnline(false);
          }
        };
        pingBackend();
        const interval = setInterval(pingBackend, 15000);
        return () => clearInterval(interval);
      }, []);

        setToast(msg);
        setTimeout(() => setToast(null), 2500);
      };

        setCart(prev => {
          const exists = prev.find(i => i.watch.id === watch.id);
          if (exists) {
            return prev.map(i => i.watch.id === watch.id ? { ...i, quantity: i.quantity + qty } : i);
          }
          return [...prev, { watch, quantity: qty }];
        });
        showNotification(`${watch.name} dimasukkan ke keranjang`);
      };

      const handleUpdateQty = (watchId, delta) => {
        setCart(prev => prev.map(i => {
          if (i.watch.id === watchId) {
            const next = i.quantity + delta;
            return next > 0 ? { ...i, quantity: next } : null;
          }
          return i;
        }).filter(Boolean));
      };

      const handleRemoveCartItem = (watchId) => {
        setCart(prev => prev.filter(i => i.watch.id !== watchId));
      };

        setWishlist(prev => prev.includes(id) ? prev.filter(i => i !== id) : [...prev, id]);
      };

        let list = [...watches];

          list = list.filter(w => w.category.toLowerCase() === selectedCategory.toLowerCase());

          const q = searchQuery.toLowerCase();
          list = list.filter(w => 
            w.name.toLowerCase().includes(q) ||
            w.series.toLowerCase().includes(q) ||
            w.movement.toLowerCase().includes(q)
          );
        }

        if (sortBy === 'rating') list.sort((a,b) => b.rating - a.rating);
        return list;
      }, [watches, selectedCategory, searchQuery, sortBy]);

                    )}
                    <button
                      onClick={() => handleToggleWishlist(watch.id)}
                      className="absolute top-3 right-3 p-1.5 rounded-full bg-black/60 text-white/80 hover:text-[#c5a880]"
                    >
                      <svg className="w-4 h-4" fill={wishlist.includes(watch.id) ? "#c5a880" : "none"} stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"></path></svg>
                    </button>
                  </div>

                  <div className="p-5 flex-1 flex flex-col justify-between space-y-3">
                    <div>
                      <div className="text-[10px] text-[#c5a880] uppercase tracking-wider font-semibold">
                        {watch.series}
                      </div>
                      <h3
                        onClick={() => setQuickViewWatch(watch)}
                        className="font-serif text-lg text-white hover:text-[#c5a880] cursor-pointer mt-0.5"
                      >
                        {watch.name}
                      </h3>
                      <p className="text-xs text-gray-400 line-clamp-1 mt-1 font-light">
                        {watch.movement}
                      </p>
                    </div>

                    <div className="pt-3 border-t border-white/5 flex items-center justify-between">
                      <div>
                        <div className="font-mono text-sm font-semibold text-white">
                          {formatIDR(watch.price_idr)}
                        </div>
                        <div className="font-mono text-[10px] text-gray-500">
                          {formatUSD(watch.price_usd)}
                        </div>
                      </div>

                      <div className="flex space-x-2">
                        <button
                          onClick={() => setQuickViewWatch(watch)}
                          className="px-2.5 py-1.5 rounded-lg bg-[#181d25] hover:bg-white/10 text-gray-300 text-xs"
                          title="Lihat Detail"
                        >
                          Detail
                        </button>
                        <button
                          onClick={() => handleAddToCart(watch, 1)}
                          disabled={!watch.in_stock}
                          className="px-3 py-1.5 rounded-lg bg-[#c5a880] hover:bg-[#d4b992] text-black font-semibold text-xs"
                          title="Tambah ke Keranjang"
                        >
                          + Beli
                        </button>
                      </div>
                    </div>
                  </div>
                </div>
              ))}
            </div>
          </main>

          {/* Filosofi Section */}
          <section id="filosofi" className="py-16 bg-[#0e1015] border-t border-b border-white/5">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
              <div className="text-center max-w-xl mx-auto mb-12">
                <span className="text-[11px] uppercase tracking-[0.25em] text-[#c5a880]">Standar Tertinggi</span>
                <h2 className="font-serif text-3xl text-white font-light mt-1">Keunggulan Nocturne Atelier</h2>
              </div>

              <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6 text-xs">
                <div className="p-6 rounded-xl bg-[#14171f] border border-white/5 space-y-2">
                  <div className="text-[#c5a880] font-serif text-xl font-bold">01</div>
                  <h4 className="font-serif text-base text-white font-medium">Presisi Kaliber Swiss</h4>
                  <p className="text-gray-400 font-light">Dikalibrasi hingga 5 posisi dengan toleransi ketat COSC Chronometer.</p>
                </div>
                <div className="p-6 rounded-xl bg-[#14171f] border border-white/5 space-y-2">
                  <div className="text-[#c5a880] font-serif text-xl font-bold">02</div>
                  <h4 className="font-serif text-base text-white font-medium">Kristal Safir Ganda</h4>
                  <p className="text-gray-400 font-light">Lapisan anti-reflektif 7 lapis di kedua sisi kaca depan dan belakang.</p>
                </div>
                <div className="p-6 rounded-xl bg-[#14171f] border border-white/5 space-y-2">
                  <div className="text-[#c5a880] font-serif text-xl font-bold">03</div>
                  <h4 className="font-serif text-base text-white font-medium">Finishing Tangan</h4>
                  <p className="text-gray-400 font-light">Setiap sudut dan jembatan dipoles manual untuk pantulan cahaya sempurna.</p>
                </div>
                <div className="p-6 rounded-xl bg-[#14171f] border border-white/5 space-y-2">
                  <div className="text-[#c5a880] font-serif text-xl font-bold">04</div>
                  <h4 className="font-serif text-base text-white font-medium">Garansi 5 Tahun</h4>
                  <p className="text-gray-400 font-light">Dukungan penuh perawatan berkala dan kurir berbrankas asuransi resmi.</p>
                </div>
              </div>
            </div>
          </section>

          {/* Quick View Modal */}
          {quickViewWatch && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-md">
              <div className="relative w-full max-w-2xl bg-[#12151b] border border-white/10 rounded-2xl overflow-hidden shadow-2xl p-6 sm:p-8">
                <button
                  onClick={() => setQuickViewWatch(null)}
                  className="absolute top-4 right-4 text-gray-400 hover:text-white text-xl"
                >
                  ✕
                </button>
                <div className="grid grid-cols-1 sm:grid-cols-2 gap-6 items-center">
                  <img
                    src={quickViewWatch.image_url}
                    alt={quickViewWatch.name}
                    className="w-full aspect-square object-cover rounded-xl bg-[#08090c]"
                  />
                  <div className="space-y-4">
                    <span className="text-[10px] uppercase text-[#c5a880] tracking-widest">{quickViewWatch.series}</span>
                    <h3 className="font-serif text-2xl text-white font-medium">{quickViewWatch.name}</h3>
                    <div className="font-mono text-xl font-bold text-[#e5cbab]">
                      {formatIDR(quickViewWatch.price_idr)}
                    </div>
                    <p className="text-xs text-gray-300 font-light leading-relaxed">
                      {quickViewWatch.description}
                    </p>
                    <div className="text-[11px] text-gray-400 border-t border-b border-white/10 py-3 space-y-1">
                      <div><strong className="text-gray-200">Kaliber:</strong> {quickViewWatch.movement}</div>
                      <div><strong className="text-gray-200">Dimensi:</strong> {quickViewWatch.case_diameter} ({quickViewWatch.thickness})</div>
                      <div><strong className="text-gray-200">Ketahanan Air:</strong> {quickViewWatch.water_resistance}</div>
                      <div><strong className="text-gray-200">Cadangan Daya:</strong> {quickViewWatch.power_reserve}</div>
                    </div>
                    <button
                      onClick={() => {
                        handleAddToCart(quickViewWatch, 1);
                        setQuickViewWatch(null);
                      }}
                      className="w-full py-3 bg-[#c5a880] hover:bg-[#d4b992] text-black font-semibold text-xs uppercase tracking-wider rounded-lg transition-colors"
                    >
                      Masukkan ke Keranjang
                    </button>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* Cart Drawer */}
          {isCartOpen && (
            <div className="fixed inset-0 z-50 overflow-hidden">
              <div onClick={() => setIsCartOpen(false)} className="absolute inset-0 bg-black/70 backdrop-blur-sm"></div>
              <div className="fixed inset-y-0 right-0 max-w-full flex pl-10">
                <div className="w-screen max-w-md bg-[#12151b] border-l border-white/10 p-6 flex flex-col justify-between shadow-2xl">
                  <div>
                    <div className="flex justify-between items-center pb-4 border-b border-white/10">
                      <h3 className="font-serif text-xl text-white font-medium">Peti Koleksi Anda ({cartCount})</h3>
                      <button onClick={() => setIsCartOpen(false)} className="text-gray-400 hover:text-white">✕</button>
                    </div>

                    <div className="mt-4 space-y-3 max-h-[60vh] overflow-y-auto">
                      {cart.length === 0 ? (
                        <div className="py-12 text-center text-xs text-gray-400">Keranjang masih kosong.</div>
                      ) : (
                        cart.map(item => (
                          <div key={item.watch.id} className="flex space-x-3 p-3 rounded-lg bg-[#181d25] border border-white/5 items-center">
                            <img src={item.watch.image_url} className="w-14 h-14 object-cover rounded bg-black" />
                            <div className="flex-1 text-xs">
                              <div className="font-serif text-sm text-white font-medium line-clamp-1">{item.watch.name}</div>
                              <div className="font-mono text-gray-300 mt-0.5">{formatIDR(item.watch.price_idr)}</div>
                              <div className="flex items-center space-x-2 mt-2">
                                <button onClick={() => handleUpdateQty(item.watch.id, -1)} className="px-2 py-0.5 bg-black/40 rounded text-gray-300">-</button>
                                <span className="font-mono">{item.quantity}</span>
                                <button onClick={() => handleUpdateQty(item.watch.id, 1)} className="px-2 py-0.5 bg-black/40 rounded text-gray-300">+</button>
                                <button onClick={() => handleRemoveCartItem(item.watch.id)} className="ml-auto text-red-400 text-[10px]">Hapus</button>
                              </div>
                            </div>
                          </div>
                        ))
                      )}
                    </div>
                  </div>

                  {cart.length > 0 && (
                    <div className="pt-4 border-t border-white/10 space-y-3 text-xs">
                      <div className="flex justify-between text-gray-400">
                        <span>Total Pembayaran:</span>
                        <span className="font-mono text-base font-bold text-[#e5cbab]">{formatIDR(cartTotal)}</span>
                      </div>
                      <button
                        onClick={() => {
                          setIsCartOpen(false);
                          setIsCheckoutOpen(true);
                        }}
                        className="w-full py-3 bg-[#c5a880] hover:bg-[#d4b992] text-black font-semibold text-xs uppercase tracking-wider rounded-lg transition-colors"
                      >
                        Lanjut ke Pemesanan
                      </button>
                    </div>
                  )}
                </div>
              </div>
            </div>
          )}

          {/* Checkout Modal */}
          {isCheckoutOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/85 backdrop-blur-md">
              <div className="relative w-full max-w-lg bg-[#12151b] border border-white/10 rounded-2xl p-6 sm:p-8 shadow-2xl">
                <button onClick={() => setIsCheckoutOpen(false)} className="absolute top-4 right-4 text-gray-400 hover:text-white">✕</button>
                <span className="text-[10px] uppercase text-[#c5a880] tracking-widest font-semibold">Atelier Order</span>
                <h3 className="font-serif text-2xl text-white font-medium mt-1">Konfirmasi Pemesanan</h3>

                <form
                  onSubmit={async (e) => {
                    e.preventDefault();
                    const form = e.target;
                    const name = form.name.value;
                    const email = form.email.value;
                    const phone = form.phone.value;
                    const address = form.address.value;

                    try {
                      if (backendOnline) {
                        await fetch('http://localhost:8080/api/orders', {
                          method: 'POST',
                          headers: { 'Content-Type': 'application/json' },
                          body: JSON.stringify({
                            customer_name: name,
                            customer_email: email,
                            customer_phone: phone,
                            shipping_address: address,
                            payment_method: 'Transfer Bank Mandiri / BCA',
                            items: cart.map(i => ({
                              watch_id: i.watch.id,
                              name: i.watch.name,
                              quantity: i.quantity,
                              price_idr: i.watch.price_idr
                            }))
                          })
                        });
                      }
                      alert(`Terima kasih Bapak/Ibu ${name}. Pesanan Anda senilai ${formatIDR(cartTotal)} telah diterima dan tersimpan di brankas.`);
                      setCart([]);
                      setIsCheckoutOpen(false);
                    } catch (err) {
                      alert('Pesanan berhasil dicatat!');
                      setCart([]);
                      setIsCheckoutOpen(false);
                    }
                  }}
                  className="space-y-4 mt-6 text-xs"
                >
                  <div>
                    <label className="block text-gray-400 mb-1">Nama Lengkap</label>
                    <input name="name" required placeholder="Alexander Pratama" className="w-full bg-[#181d25] border border-white/10 rounded-lg p-2.5 text-white" />
                  </div>
                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block text-gray-400 mb-1">Email</label>
                      <input name="email" type="email" required placeholder="alexander@domain.com" className="w-full bg-[#181d25] border border-white/10 rounded-lg p-2.5 text-white" />
                    </div>
                    <div>
                      <label className="block text-gray-400 mb-1">No. WhatsApp</label>
                      <input name="phone" required placeholder="0812-xxxx-xxxx" className="w-full bg-[#181d25] border border-white/10 rounded-lg p-2.5 text-white" />
                    </div>
                  </div>
                  <div>
                    <label className="block text-gray-400 mb-1">Alamat Pengiriman Berasuransi</label>
                    <textarea name="address" required rows="2" placeholder="Alamat lengkap tujuan kurir khusus..." className="w-full bg-[#181d25] border border-white/10 rounded-lg p-2.5 text-white" />
                  </div>
                  <div className="p-3 bg-[#181d25] rounded-lg flex justify-between font-mono text-sm">
                    <span className="text-gray-400 font-sans text-xs">Total Pembayaran:</span>
                    <span className="text-[#e5cbab] font-bold">{formatIDR(cartTotal)}</span>
                  </div>
                  <button
                    type="submit"
                    className="w-full py-3 bg-[#c5a880] hover:bg-[#d4b992] text-black font-semibold text-xs uppercase tracking-wider rounded-lg transition-colors"
                  >
                    Kirim & Selesaikan Pemesanan
                  </button>
                </form>
              </div>
            </div>
          )}

          {/* Footer */}
          <footer className="bg-[#08090c] border-t border-white/5 py-8 text-center text-xs text-gray-500">
            <p className="font-serif text-lg text-white font-light tracking-[0.2em]">NOCTURNE</p>
            <p className="text-[11px] mt-1 text-gray-400">Genève • Tokyo • Jakarta</p>
            <p className="mt-4 text-[10px] text-gray-600">
              Dibangun dengan Rust (Axum REST API) & React Minimalist Luxury Architecture.
            </p>
          </footer>
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
